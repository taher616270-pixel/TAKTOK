<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAKTOK</title>
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./components/bottom-bar.css">
</head>
<body>

<header class="top-bar">
  <div class="top-search-row">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M21 21l-4.3-4.3"/></svg>
    <div style="display:flex;gap:10px;align-items:center">
      <span>الدمام</span>
      <span>📍</span>
    </div>
  </div>
  <div class="tabs-row" id="tabs">
    <span class="tab" data-view="dammam">الدمام</span>
    <span class="tab" data-view="community">المجتمع</span>
    <span class="tab" data-view="following">اتابعه</span>
    <span class="tab active" data-view="foryou">لك</span>
  </div>
</header>

<main class="main-feed" id="mainFeed">
  <section class="video-page">
    <div class="video-center">💔💔 حسمي الله عليك التطبيق<br><br>كم باقي على 2027</div>
    <div class="side-actions">
      <div class="action"><div class="icon-circle">❤️</div><span>199</span></div>
      <div class="action"><div class="icon-circle">💬</div><span>34</span></div>
      <div class="action"><div class="icon-circle">🔖</div><span>30</span></div>
      <div class="action"><div class="icon-circle">↗️</div></div>
      <div class="action"><div class="icon-circle" style="border:2px solid #fff"><img src="https://i.pravatar.cc/100?img=5" style="width:100%;height:100%;border-radius:50%"></div></div>
    </div>
    <div class="video-info"><b>يا رب صبرني انا تعبت 💔</b><br>الصوت الأصلي - wafaf_gh</div>
  </section>
</main>

<section class="grid-view" id="gridView">
  <div class="grid-item"><img src="https://picsum.photos/400/600?1"><span class="grid-meta">1092 ❤️</span></div>
  <div class="grid-item"><img src="https://picsum.photos/400/600?2"><span class="grid-meta">784 ❤️</span></div>
  <div class="grid-item"><img src="https://picsum.photos/400/600?3"><span class="grid-meta">233 ❤️</span></div>
  <div class="grid-item"><img src="https://picsum.photos/400/600?4"><span class="grid-meta">871 ❤️</span></div>
</section>

<div class="region-modal" id="regionModal">
  <div class="region-header"><span id="closeRegion">✕</span><span>تغيير المنطقة</span><span></span></div>
  <div style="padding:12px">
    <input style="width:100%;padding:10px;border-radius:10px;border:1px solid #ddd" placeholder="البحث عن مناطق في المملكة">
    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="city">الدمام</button><button class="city">جدة</button><button class="city">الرياض</button><button class="city">مكة المكرمة</button><button class="city">المدينة المنورة</button><button class="city">تبوك</button>
    </div>
  </div>
</div>

<div id="bottomNavContainer"></div>

<script type="module">
import { renderBottomNav } from './components/bottom-bar.js';
document.getElementById('bottomNavContainer').appendChild(renderBottomNav('home'));

const tabs=document.getElementById('tabs'), main=document.getElementById('mainFeed'), grid=document.getElementById('gridView');
tabs.onclick=e=>{
  if(!e.target.classList.contains('tab'))return;
  tabs.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
  let v=e.target.dataset.view;
  if(v==='dammam') document.getElementById('regionModal').classList.add('active');
  else if(v==='community'){ main.style.display='none'; grid.classList.add('active'); }
  else{ main.style.display='block'; grid.classList.remove('active'); }
}
document.getElementById('closeRegion').onclick=()=>document.getElementById('regionModal').classList.remove('active');
</script>
</body>
</html>
