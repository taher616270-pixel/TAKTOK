<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><meta name="description" content="TAKTOK — منصة الفيديوهات القصيرة"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./app.css"><title>TAKTOK</title></head>
<body><main class="app">
<header class="topbar"><button class="top-live" id="liveBtn">LIVE</button><div class="feed-tabs" id="feedTabs"><button data-tab="following">أتابعه</button><button class="active" data-tab="foryou">لك</button></div><button class="top-search" id="navSearch" aria-label="بحث">⌕</button></header>
<div class="feed" id="feed"></div>
<nav class="bottom-nav"><button class="nav-btn active" id="navHome"><span>⌂</span>الرئيسية</button><button class="nav-btn" id="navFriends"><span>♧</span>الأصدقاء</button><button class="nav-btn create-btn" id="navCreate"><span>＋</span></button><button class="nav-btn" id="navInbox"><span>✉</span>الوارد</button><button class="nav-btn" id="navProfile"><span>♙</span>حسابي</button></nav>
<input id="upload" type="file" accept="video/*" hidden><div id="toast" class="toast"></div>
<section class="panel" id="friends"><header><b>الأصدقاء</b><button data-close>✕</button></header><div class="friend-intro">لحظات وأخبار أصدقائك في مكان واحد</div><div class="friend-tabs"><button class="active" data-friend-tab="all">الكل</button><button data-friend-tab="videos">فيديوهات</button><button data-friend-tab="photos">صور</button></div><div id="friendsFeed" class="friends-feed"></div></section>
<section class="panel" id="search"><header><b>اكتشف</b><button data-close>✕</button></header><input id="searchInput" placeholder="ابحث عن حساب أو فيديو أو وسم"><div id="searchResults"><p class="muted">ابحث عن حساب أو وصف فيديو</p></div></section>
<section class="panel" id="inbox"><header><b>الوارد</b><button data-close>✕</button></header><div class="empty-panel">ستظهر هنا الرسائل والإشعارات عند ربط نظام الحسابات والخادم.</div></section>
<section class="panel" id="profile"><header><b>الملف الشخصي</b><button data-close>✕</button></header><div class="profile-head"><img src="https://i.pravatar.cc/150?u=taktok"><div><b id="username">@taherkld</b><button id="editProfile">تعديل الملف</button></div></div><div class="stats"><div><b id="statFollowing">0</b>يتابع</div><div><b id="statLikes">0</b>الإعجابات</div><div><b id="statVideos">0</b>فيديو</div></div><div class="empty-panel">فيديوهاتك المحفوظة والمنشورة تظهر هنا</div></section>
<section class="panel" id="editProfilePanel"><header><b>تعديل الملف</b><button data-close>✕</button></header><label>اسم المستخدم</label><input id="editName" maxlength="24" placeholder="اسم المستخدم"><button id="saveProfile" class="primary">حفظ التغييرات</button></section>
<section class="panel" id="comments"><header><b>التعليقات</b><button data-close>✕</button></header><div id="commentList" class="comment-list"></div><form id="commentForm"><input id="commentInput" maxlength="300" placeholder="أضف تعليقاً..." required><button class="primary">إرسال</button></form></section>
<section class="panel" id="morePanel"><header><b>خيارات الفيديو</b><button data-close>✕</button></header><button id="report">⚑ الإبلاغ عن الفيديو</button><button id="block">⊘ حظر الحساب</button></section>
<script src="./app.js" defer></script></main></body></html>
